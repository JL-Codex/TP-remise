# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:remisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Console ────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Schema initialisation (Spring JDBC layer) ─────────────────────────────────
# schema.sql creates the tables; data.sql seeds them.
# "always" ensures they run on every start with the in-memory DB.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# "none" prevents Hibernate from attempting its own DDL — schema.sql owns that.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Let Hibernate discover the RemiseEntity without an explicit persistence.xml.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Ensure Spring initialises the schema BEFORE Hibernate validates/uses it.
spring.jpa.defer-datasource-initialization=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
